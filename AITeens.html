/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:.5rem;font:inherit;font-weight:700;cursor:pointer;

.btn-gold{background:transparent;border-color:var(--gold);color:var(--gold)}

.btn-gold-fill{background:var(--gold);color:#1c1204}
.btn-gold-fill:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-lg{padding:1rem 1.8rem;font-size:1.05rem}
.pay-note{margin-top:.9rem;font-size:.82rem;color:var(--on-deep-2);font-family:"IBM Plex Mono",monospace;letter-spacing:.02em}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 88%,transparent);

.brand{display:flex;align-items:center;gap:.55rem;font-family:"Fraunces",serif;font-weight:600;font-size:1.05rem;text-decoration:none;color:var(--ink)}
.brand svg{flex:none}
.topbar nav{display:flex;gap:1.4rem;margin-left:auto;font-size:.9rem}
.topbar nav a{text-decoration:none;color:var(--ink-2)}
.topbar nav a:hover{color:var(--ink)}
.topbar .btn{margin-left:1rem;padding:.55rem 1.1rem;font-size:.9rem}

section{padding:clamp(3.5rem,8vw,6rem) 0}
